[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domainsnipe"
version = "0.1.0"
description = "Expiring domain sniper bot for finding and registering valuable dropped domains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "python-whois>=0.8.0",
    "anthropic>=0.18.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
domainsnipe = "domainsnipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
